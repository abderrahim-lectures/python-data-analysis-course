name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build site
        run: npm run build

      # tests/e2e/*.spec.ts still target the old Docusaurus DOM/build (npm run
      # serve on :3050, React component selectors) and need porting to the
      # Astro site before this step is meaningful again. See plan/astro-rebuild.md.
