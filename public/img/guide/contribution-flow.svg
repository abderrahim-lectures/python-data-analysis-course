<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
  <title id="t">How a contribution travels from your copy to the live site</title>
  <desc id="d">Fork the repository to your own account, clone it locally, create a branch, commit and push, then open a pull request against main. Once it merges, the deploy workflow publishes the site.</desc>
  <style>
    .bg { fill: #faf9fc; }
    .track { stroke: #cfc9d8; stroke-width: 2; }
    .node { fill: #ffffff; stroke: #cfc9d8; stroke-width: 1.5; }
    .node-accent { fill: rgba(124,58,237,.08); stroke: #7c3aed; stroke-width: 1.8; }
    .node-final { fill: rgba(16,185,129,.10); stroke: #059669; stroke-width: 1.8; }
    .ink { fill: #1a1a2e; }
    .ink-soft { fill: #57534e; }
    .ink-faint { fill: #6b6675; }
    .accent { fill: #6d28d9; }
    .green { fill: #047857; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .dot { fill: #7c3aed; }
    .dot-green { fill: #059669; }
    .stage { fill: #7c3aed; }
    .stage-txt { fill: #ffffff; font-size: 11px; font-weight: 800; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0c0b14; }
      .track { stroke: #3f3b54; }
      .node { fill: #1a1828; stroke: #2e2b42; }
      .node-accent { fill: rgba(167,139,250,.14); stroke: #a78bfa; }
      .node-final { fill: rgba(16,185,129,.16); stroke: #34d399; }
      .ink { fill: #e8e4f0; }
      .ink-soft { fill: #a89ec4; }
      .ink-faint { fill: #9a92a8; }
      .accent { fill: #c4b5fd; }
      .green { fill: #6ee7b7; }
      .dot { fill: #a78bfa; }
      .dot-green { fill: #34d399; }
      .stage { fill: #8b5cf6; }
    }
  </style>

  <rect class="bg" width="900" height="340" rx="14"/>
  <text class="sans ink" x="36" y="42" font-size="19" font-weight="800">From your copy to the live site</text>
  <text class="sans ink-soft" x="36" y="65" font-size="12.5">Five steps. You do the first four; the last one happens on its own after the merge.</text>

  <!-- the rail -->
  <line class="track" x1="70" y1="150" x2="840" y2="150"/>

  <!-- node 1 -->
  <circle class="node-accent" cx="110" cy="150" r="26"/>
  <circle class="dot" cx="110" cy="150" r="7"/>
  <text class="sans ink" x="110" y="205" font-size="12.5" font-weight="700" text-anchor="middle">Fork</text>
  <text class="sans ink-soft" x="110" y="222" font-size="11" text-anchor="middle">your own copy</text>
  <text class="sans ink-faint" x="110" y="237" font-size="11" text-anchor="middle">on GitHub</text>

  <!-- node 2 -->
  <circle class="node-accent" cx="260" cy="150" r="26"/>
  <circle class="dot" cx="260" cy="150" r="7"/>
  <text class="sans ink" x="260" y="205" font-size="12.5" font-weight="700" text-anchor="middle">Clone</text>
  <text class="mono ink-soft" x="260" y="222" font-size="10" text-anchor="middle">git clone</text>
  <text class="sans ink-faint" x="260" y="237" font-size="11" text-anchor="middle">to your machine</text>

  <!-- node 3 -->
  <circle class="node-accent" cx="420" cy="150" r="26"/>
  <circle class="dot" cx="420" cy="150" r="7"/>
  <text class="sans ink" x="420" y="205" font-size="12.5" font-weight="700" text-anchor="middle">Branch</text>
  <text class="mono ink-soft" x="420" y="222" font-size="10" text-anchor="middle">checkout -b</text>
  <text class="sans ink-faint" x="420" y="237" font-size="11" text-anchor="middle">one branch per change</text>

  <!-- node 4 -->
  <circle class="node-accent" cx="580" cy="150" r="26"/>
  <circle class="dot" cx="580" cy="150" r="7"/>
  <text class="sans ink" x="580" y="205" font-size="12.5" font-weight="700" text-anchor="middle">Commit &amp; push</text>
  <text class="sans ink-faint" x="580" y="222" font-size="11" text-anchor="middle">your work goes to your fork</text>

  <!-- node 5 -->
  <circle class="node-final" cx="750" cy="150" r="26"/>
  <circle class="dot-green" cx="750" cy="150" r="7"/>
  <text class="sans ink" x="750" y="205" font-size="12.5" font-weight="700" text-anchor="middle">Pull request</text>
  <text class="sans ink-faint" x="750" y="222" font-size="11" text-anchor="middle">ask to merge into main</text>

  <!-- merge note -->
  <path class="track" d="M750 176 L750 268"/>
  <rect class="node-final" x="612" y="268" width="276" height="46" rx="10"/>
  <text class="sans green" x="628" y="288" font-size="11.5" font-weight="700">Merge into main</text>
  <text class="sans ink-soft" x="628" y="304" font-size="11">the workflow builds and publishes.</text>

  <!-- stage labels, y=100 -->
  <text class="sans ink-faint" x="110" y="110" font-size="10.5" text-anchor="middle">ON GITHUB</text>
  <text class="sans ink-faint" x="260" y="110" font-size="10.5" text-anchor="middle">ON YOUR MACHINE</text>
  <text class="sans ink-faint" x="420" y="110" font-size="10.5" text-anchor="middle">ON YOUR MACHINE</text>
  <text class="sans ink-faint" x="580" y="110" font-size="10.5" text-anchor="middle">BACK TO GITHUB</text>
  <text class="sans ink-faint" x="750" y="110" font-size="10.5" text-anchor="middle">REVIEW</text>
</svg>
