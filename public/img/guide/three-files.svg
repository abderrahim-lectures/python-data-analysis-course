<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">The three files a new project needs</title>
  <desc id="d">Step one is a markdown file under src/content/projects, which is required. Step two is an optional examples folder holding runnable code. Step three is one entry in src/lib/contributors.ts so your name appears on the contributors page.</desc>
  <style>
    .bg { fill: #faf9fc; }
    .card { fill: #ffffff; stroke: #e5e1ea; stroke-width: 1.5; }
    .head-1 { fill: rgba(124,58,237,.08); }
    .head-2 { fill: rgba(217,119,6,.10); }
    .ink { fill: #1a1a2e; }
    .ink-soft { fill: #57534e; }
    .ink-faint { fill: #6b6675; }
    .accent { fill: #7c3aed; }
    .amber { fill: #b45309; }
    .line { stroke: #cfc9d8; stroke-width: 1.5; }
    .divider { stroke: #eceaf2; stroke-width: 1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .chip-req { fill: #7c3aed; }
    .chip-opt { fill: #d97706; }
    .chip-txt { fill: #ffffff; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; }
    .step { fill: #7c3aed; }
    .step-opt { fill: #d97706; }
    .step-txt { fill: #ffffff; font-size: 13px; font-weight: 800; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0c0b14; }
      .card { fill: #1a1828; stroke: #2e2b42; }
      .head-1 { fill: rgba(167,139,250,.14); }
      .head-2 { fill: rgba(245,158,11,.14); }
      .ink { fill: #e8e4f0; }
      .ink-soft { fill: #a89ec4; }
      .ink-faint { fill: #9a92a8; }
      .accent { fill: #c4b5fd; }
      .amber { fill: #fbbf24; }
      .line { stroke: #3f3b54; }
      .divider { stroke: #2e2b42; }
      .step { fill: #8b5cf6; }
      .step-opt { fill: #d97706; }
    }
  </style>

  <rect class="bg" width="900" height="430" rx="14"/>

  <text class="sans ink" x="36" y="42" font-size="19" font-weight="800">Three files, one project</text>
  <text class="sans ink-soft" x="36" y="65" font-size="12.5">Work left to right. The chip on each card says whether you must touch that file.</text>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- card 1 -->
  <rect class="card" x="36" y="92" width="252" height="292" rx="12"/>
  <path class="head-1" d="M36 104 a12 12 0 0 1 12 -12 h228 a12 12 0 0 1 12 12 v40 h-252 z"/>
  <circle class="step" cx="62" cy="118" r="11"/>
  <text class="sans step-txt" x="62" y="123" text-anchor="middle">1</text>
  <text class="sans ink" x="82" y="123" font-size="13.5" font-weight="700">Write the project</text>
  <text class="mono accent" x="56" y="150" font-size="11.5">src/content/projects/</text>
  <text class="mono accent" x="56" y="166" font-size="11.5">&lt;your-slug&gt;.md</text>

  <rect class="chip-req" x="56" y="186" width="62" height="19" rx="9"/>
  <text class="sans chip-txt" x="64" y="199">REQUIRED</text>

  <line class="divider" x1="56" y1="218" x2="268" y2="218"/>
  <text class="sans ink-soft" x="56" y="242" font-size="11.5">Frontmatter: title,</text>
  <text class="sans ink-soft" x="56" y="259" font-size="11.5">description, difficulty,</text>
  <text class="sans ink-soft" x="56" y="276" font-size="11.5">author. Then the lesson</text>
  <text class="sans ink-soft" x="56" y="293" font-size="11.5">body, in markdown.</text>
  <text class="sans ink-faint" x="56" y="325" font-size="11">Fastest start: copy</text>
  <text class="mono ink-faint" x="56" y="342" font-size="11">ai-agent.md</text>

  <!-- arrow 1->2 -->
  <line class="line" x1="292" y1="238" x2="322" y2="238" marker-end="url(#arw)"/>

  <!-- card 2 -->
  <rect class="card" x="326" y="92" width="248" height="292" rx="12"/>
  <path class="head-2" d="M326 104 a12 12 0 0 1 12 -12 h224 a12 12 0 0 1 12 12 v40 h-248 z"/>
  <circle class="step-opt" cx="352" cy="118" r="11"/>
  <text class="sans step-txt" x="352" y="123" text-anchor="middle">2</text>
  <text class="sans ink" x="372" y="123" font-size="13.5" font-weight="700">Add the code</text>
  <text class="mono amber" x="346" y="150" font-size="11.5">examples/</text>
  <text class="mono amber" x="346" y="166" font-size="11.5">&lt;your-slug&gt;/</text>

  <rect class="chip-opt" x="346" y="186" width="62" height="19" rx="9"/>
  <text class="sans chip-txt" x="354" y="199">OPTIONAL</text>

  <line class="divider" x1="346" y1="218" x2="554" y2="218"/>
  <text class="sans ink-soft" x="346" y="242" font-size="11.5">A runnable version of</text>
  <text class="sans ink-soft" x="346" y="259" font-size="11.5">what the project builds,</text>
  <text class="sans ink-soft" x="346" y="276" font-size="11.5">with its own README.</text>
  <text class="sans ink-faint" x="346" y="308" font-size="11">Skip it when the code</text>
  <text class="sans ink-faint" x="346" y="325" font-size="11">is short enough to sit</text>
  <text class="sans ink-faint" x="346" y="342" font-size="11">inside the lesson.</text>

  <!-- arrow 2->3 -->
  <line class="line" x1="578" y1="238" x2="608" y2="238" marker-end="url(#arw)"/>

  <!-- card 3 -->
  <rect class="card" x="612" y="92" width="252" height="292" rx="12"/>
  <path class="head-1" d="M612 104 a12 12 0 0 1 12 -12 h228 a12 12 0 0 1 12 12 v40 h-252 z"/>
  <circle class="step" cx="638" cy="118" r="11"/>
  <text class="sans step-txt" x="638" y="123" text-anchor="middle">3</text>
  <text class="sans ink" x="658" y="123" font-size="13.5" font-weight="700">Claim the credit</text>
  <text class="mono accent" x="632" y="150" font-size="11.5">src/lib/</text>
  <text class="mono accent" x="632" y="166" font-size="11.5">contributors.ts</text>

  <rect class="chip-req" x="632" y="186" width="62" height="19" rx="9"/>
  <text class="sans chip-txt" x="640" y="199">REQUIRED</text>

  <line class="divider" x1="632" y1="218" x2="844" y2="218"/>
  <text class="sans ink-soft" x="632" y="242" font-size="11.5">One entry with a stable</text>
  <text class="sans ink-soft" x="632" y="259" font-size="11.5">id and your name, then</text>
  <text class="sans ink-soft" x="632" y="276" font-size="11.5">the same id in the</text>
  <text class="sans ink-soft" x="632" y="293" font-size="11.5">project's author field.</text>
  <text class="sans ink-faint" x="632" y="325" font-size="11">No GitHub account</text>
  <text class="sans ink-faint" x="632" y="342" font-size="11">needed to be credited.</text>

  <!-- footer -->
  <rect x="36" y="396" width="828" height="1" class="divider"/>
  <text class="sans ink-faint" x="36" y="416" font-size="11">After the three files: run the tests, commit, push, and open a pull request. The next diagram shows where those steps happen.</text>
</svg>
