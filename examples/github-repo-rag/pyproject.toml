[project]
name = "github-repo-rag"
version = "0.1.0"
description = "Local companion to the course's 'Build a RAG App Over a GitHub Repo' project: clone a repo, chunk its code and docs with line tracking, embed locally, and answer questions with file-and-line citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.3.1",
    "numpy>=2.2.0",
    "python-dotenv>=1.2.2",
    "openai>=1.59.0",
]
