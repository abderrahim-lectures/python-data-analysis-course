[project]
name = "codebase-qa"
version = "0.1.0"
description = "Local companion to the course's 'Build a Codebase Q&A Tool' project: answer 'where is X defined?' with an exact ast-based symbol index and 'how does X work?' with local embedding search, grounding a free-tier LLM in file:line citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.3.1",
    "numpy>=2.2.0",
    "python-dotenv>=1.2.2",
    "openai>=1.59.0",
]
