# app.toml
# Main application configuration for the bookstore service.

[database]
dbname = "bookstore"
seed_tables = ["users", "books"]
migrate_tables = ["users", "sessions", "orders", "order_items", "books", "tax_rates"]

[auth]
jwt_secret = "change-me-in-prod"
token_ttl_seconds = 3600

[server]
port = 8080
host = "127.0.0.1"
